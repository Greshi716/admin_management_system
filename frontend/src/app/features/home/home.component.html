<header class="flex items-center justify-between border-b border-border bg-surface px-6 py-3">
  <span class="font-bold text-accent-text">CampusFlow</span>
  <div class="flex items-center gap-3">
    <span class="text-muted" data-testid="user-name">{{ store.user()?.name }}</span>
    <p-button label="Change password" severity="secondary" [outlined]="true" (onClick)="changeOpen.set(true)" />
    <p-button label="Log out" severity="secondary" [outlined]="true" (onClick)="logout()" />
  </div>
</header>

<main class="p-6">
  <h1 class="text-2xl font-bold" data-testid="welcome">Welcome, {{ store.user()?.name }}</h1>
  <p class="mt-2 text-muted">The screens for fees, payroll and funds will appear here.</p>
  <nav class="mt-6 flex flex-wrap gap-3" aria-label="Master data">
    <a routerLink="/master-data/academic-years" class="text-accent-text underline">Academic years</a>
    <a routerLink="/master-data/standards" class="text-accent-text underline">Standards</a>
    <a routerLink="/master-data/divisions" class="text-accent-text underline">Divisions</a>
    <a routerLink="/master-data/student-categories" class="text-accent-text underline">Student categories</a>
  </nav>
</main>

<p-dialog
  header="Change your password"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [visible]="reminderOpen()"
  (visibleChange)="reminderOpen.set($event)"
  [style]="{ width: '26rem', maxWidth: '95vw' }"
>
  <p class="mb-4">You are using the password that was made for you. Please choose your own.</p>
  <div class="flex justify-end gap-2">
    <p-button label="Later" severity="secondary" [outlined]="true" (onClick)="later()" />
    <p-button label="Change now" (onClick)="changeNow()" />
  </div>
</p-dialog>

<app-change-password-dialog [(visible)]="changeOpen" />
