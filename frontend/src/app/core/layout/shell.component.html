<header class="sticky top-0 z-10 bg-accent-deep text-on-accent shadow-md">
  <div class="mx-auto flex w-full max-w-[1280px] flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2 md:px-8">
    <a routerLink="/" class="flex items-center gap-3 text-on-accent no-underline">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-accent text-lg font-bold text-on-accent" aria-hidden="true">C</span>
      <span class="text-lg font-bold">CampusFlow</span>
    </a>

    <nav class="flex gap-1" aria-label="Main">
      @for (tab of tabs; track tab.link) {
        @if (closed(tab)) {
          <span
            aria-disabled="true"
            title="Create an academic year covering today first"
            class="cursor-not-allowed rounded-control px-4 py-2 text-[0.95rem] text-on-accent opacity-60"
            >{{ tab.label }}</span
          >
        } @else {
          <a
            [routerLink]="tab.link"
            routerLinkActive="bg-accent font-semibold"
            class="rounded-control px-4 py-2 text-[0.95rem] text-on-accent no-underline transition-colors hover:bg-accent-strong"
            >{{ tab.label }}</a
          >
        }
      }
    </nav>

    <div class="ml-auto flex flex-wrap items-center gap-2 sm:gap-3">
      @if (store.currentYear(); as year) {
        <span class="rounded-full bg-accent px-3 py-1 text-sm font-semibold text-on-accent" data-testid="current-year">
          Academic year {{ year }}
        </span>
      }
      <span class="hidden text-sm font-semibold sm:block" data-testid="user-name">{{ store.user()?.name }}</span>
      <button type="button" (click)="changeOpen.set(true)" class="btn btn-sm border border-on-accent/60 bg-transparent text-on-accent hover:bg-accent-strong">Change password</button>
      <button type="button" (click)="logout()" class="btn btn-sm border border-on-accent/60 bg-transparent text-on-accent hover:bg-accent-strong">Log out</button>
    </div>
  </div>
</header>

<main class="mx-auto w-full max-w-[1280px] px-4 py-6 md:px-8 md:py-8">
  @if (store.noCurrentYear()) {
    <app-no-current-year-notice />
  }
  @if (navigating()) {
    <app-page-skeleton />
  }
  <div [class.hidden]="navigating()">
    <router-outlet />
  </div>
</main>

<app-password-popup (changeRequested)="changeOpen.set(true)" />

<app-change-password-dialog [(visible)]="changeOpen" />
