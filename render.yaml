# Render Blueprint for CampusFlow
# Deploys both a Free PostgreSQL Database and the unified Spring Boot + Angular application.
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: campusflow-db
    databaseName: admin_management_db
    user: postgres
    plan: free

services:
  - type: web
    name: campusflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: CAMPUSFLOW_DATA_DIR
        value: /app/data
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m -XX:+UseG1GC"
      - key: CAMPUSFLOW_SCHOOL_NAME
        value: "Birlasagar Higher Secondary School"
