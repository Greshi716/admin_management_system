# Render Blueprint for CampusFlow
# Connects to your Neon PostgreSQL database (Singapore region) and runs the unified web app.
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: campusflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Render will prompt you to paste your Neon DATABASE_URL during setup
      - key: CAMPUSFLOW_DATA_DIR
        value: /app/data
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m -XX:+UseG1GC"
      - key: CAMPUSFLOW_SCHOOL_NAME
        value: "Birlasagar Higher Secondary School"
