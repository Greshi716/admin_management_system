openapi: 3.0.3
info:
  title: CampusFlow F0 API
  version: 0.1.0
  description: |
    REST JSON API for the Foundation feature. Session cookie auth (JSESSIONID) with CSRF
    (cookie XSRF-TOKEN, header X-XSRF-TOKEN). All paths except /api/auth/login
    require a signed-in session (FR-001, FR-007).
servers:
  - url: /api
security:
  - session: []
paths:
  /auth/login:
    post:
      summary: Sign in (FR-001, FR-004, FR-005, FR-044)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/BadCredentials' }
        '423': { description: Sign-in paused after 5 failures (body has retryAfterSeconds), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/logout:
    post:
      summary: Sign out (FR-006)
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      summary: Current user, current academic year, password-popup flag (FR-009, FR-028)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: Not signed in }
  /auth/change-password:
    post:
      summary: Change own password (FR-009)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Changed }
        '422': { $ref: '#/components/responses/Validation' }
  /academic-years:
    get:
      summary: Academic years for pick-lists
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AcademicYear' } } } } }
    post:
      summary: Create (FR-010, FR-011)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYear' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /academic-years/search:
    post:
      summary: Standard table query (FR-029..FR-032)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/TablePage' } } } }
  /academic-years/export:
    post:
      summary: Excel export of everything matching the request, all columns (FR-033)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses:
        '200': { description: xlsx stream, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
  /academic-years/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYear' } } } }
        '404': { description: Not found }
    put:
      summary: Edit; stale version returns 409 with the latest record (FR-046)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYear' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: Delete only if unreferenced; otherwise 409 "in use" (FR-020)
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /standards:
    get:
      summary: Active standards for pick-lists
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Standard' } } } } } }
    post:
      summary: Create (FR-014, FR-015)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StandardInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Standard' } } } }, '422': { $ref: '#/components/responses/Validation' } }
  /standards/search:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/TablePage' } } } } }
  /standards/export:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: xlsx stream } }
  /standards/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    put:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StandardInput' } } } }
      responses: { '200': { description: Saved }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Conflict' } }
  /standards/{id}/active:
    put:
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveInput' } } } }
      responses: { '200': { description: OK } }
  /divisions:
    post:
      summary: Create (FR-016, FR-017)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DivisionInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Division' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /divisions/search:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/TablePage' } } } } }
  /divisions/export:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: xlsx stream } }
  /divisions/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    put:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DivisionInput' } } } }
      responses: { '200': { description: Saved }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Conflict' } }
  /divisions/{id}/active:
    put:
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveInput' } } } }
      responses: { '200': { description: OK } }
  /student-categories:
    get:
      summary: Active categories for pick-lists
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StudentCategory' } } } } } }
    post:
      summary: Create (FR-019)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentCategoryInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StudentCategory' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /student-categories/search:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/TablePage' } } } } }
  /student-categories/export:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: xlsx stream } }
  /student-categories/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    put:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentCategoryInput' } } } }
      responses: { '200': { description: Saved }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Conflict' } }
  /student-categories/{id}/active:
    put:
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveInput' } } } }
      responses: { '200': { description: OK } }
  /audit-log/search:
    post:
      summary: Audit log table query; adds date range, month, year, area and action filters (FR-026)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TableRequest'
                - type: object
                  properties:
                    from: { type: string, format: date }
                    to: { type: string, format: date }
                    month: { type: string, example: '2026-10' }
                    year: { type: integer, example: 2026 }
                    area: { type: string }
                    action: { type: string }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/TablePage' } } } }
        '422': { description: from is after to }
  /audit-log/export:
    post:
      summary: Excel export of the filtered audit log; itself audited
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableRequest' } } } }
      responses: { '200': { description: xlsx stream } }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadCredentials:
      description: Wrong credentials or inactive user; the message never says which (FR-004)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Validation:
      description: Field errors
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Duplicate, overlap, in use, or stale version. For a stale version `current` holds the latest record (FR-046).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, example: STALE_VERSION }
        retryAfterSeconds: { type: integer }
        fieldErrors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
        current: { type: object, description: Latest record when code is STALE_VERSION }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string, format: password } }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties: { currentPassword: { type: string, format: password }, newPassword: { type: string, format: password } }
    Me:
      type: object
      properties:
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [ADMIN] }
        passwordChanged: { type: boolean }
        currentAcademicYear: { type: string, nullable: true, example: 2026-27, description: Null when today's date is inside no academic year; the web app then forces the admin to create one (FR-013) }
        idleTimeoutSeconds: { type: integer, example: 600 }
    ActiveInput:
      type: object
      required: [active, version]
      properties: { active: { type: boolean }, version: { type: integer, format: int64 } }
    AcademicYearInput:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        version: { type: integer, format: int64, description: Required on edit }
    AcademicYear:
      allOf:
        - $ref: '#/components/schemas/AcademicYearInput'
        - type: object
          properties: { id: { type: integer, format: int64 }, current: { type: boolean, readOnly: true, description: True when today's date is inside this year (derived, not stored) } }
    StandardInput:
      type: object
      required: [name, displayOrder]
      properties:
        name: { type: string }
        displayOrder: { type: integer }
        stream: { type: string, enum: [Science, Commerce], nullable: true }
        version: { type: integer, format: int64 }
    Standard:
      allOf:
        - $ref: '#/components/schemas/StandardInput'
        - type: object
          properties: { id: { type: integer, format: int64 }, active: { type: boolean } }
    DivisionInput:
      type: object
      required: [academicYearId, standardId, name]
      properties:
        academicYearId: { type: integer, format: int64 }
        standardId: { type: integer, format: int64 }
        name: { type: string }
        version: { type: integer, format: int64 }
    Division:
      allOf:
        - $ref: '#/components/schemas/DivisionInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            academicYearName: { type: string }
            standardName: { type: string }
            active: { type: boolean }
    StudentCategoryInput:
      type: object
      required: [code, name, affectsFees]
      properties:
        code: { type: string }
        name: { type: string }
        affectsFees: { type: boolean }
        version: { type: integer, format: int64 }
    StudentCategory:
      allOf:
        - $ref: '#/components/schemas/StudentCategoryInput'
        - type: object
          properties: { id: { type: integer, format: int64 }, active: { type: boolean } }
    TableRequest:
      type: object
      description: Mirrors PrimeNG's lazy-load event so the table passes it through unchanged.
      properties:
        first: { type: integer, minimum: 0, default: 0 }
        rows: { type: integer, enum: [10, 25, 50, 100], default: 25 }
        sortField: { type: string }
        sortOrder: { type: integer, enum: [1, -1], description: 1 ascending, -1 descending }
        globalFilter: { type: string, description: Search across the list's searchable columns }
        filters:
          type: object
          additionalProperties:
            type: object
            properties:
              value: {}
              matchMode: { type: string, enum: [contains, startsWith, equals, dateRange, boolean] }
    TablePage:
      type: object
      required: [rows, total]
      properties:
        rows: { type: array, items: { type: object } }
        total: { type: integer, format: int64 }
