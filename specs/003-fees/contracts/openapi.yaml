openapi: 3.0.3
info:
  title: CampusFlow F2 API (fees)
  version: 0.3.0
  description: |
    Endpoints added or changed by F2. Authentication, CSRF, the error shape (Problem), TableRequest, TablePage
    and the stale-save rule (409 STALE_VERSION with the latest record) are those of F0
    (../../001-foundation/contracts/openapi.yaml). F1 endpoints are in ../../002-students/contracts/openapi.yaml
    on branch 002-students. Amounts are JSON numbers with at most two decimals and at least zero; anything else is
    refused with a field error (422), never rounded.
servers:
  - url: /api
security:
  - session: []
paths:
  /fee-structures/{yearId}:
    get:
      summary: The fee structure of one academic year (FR-001, FR-002, FR-003)
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Status, rows and the number of class records of the year, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStructure' } } } }
        '404': { description: No such academic year }
  /fee-structures/{yearId}/rows:
    post:
      summary: Add a row (FR-001). Draft year - saved at once. Finalised year - a revise (FR-004), needs confirm=true.
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Confirm' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeRowInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FeeRow' } } } }
        '409': { $ref: '#/components/responses/ReviseOrDuplicate' }
        '422': { $ref: '#/components/responses/Validation' }
  /fee-structures/{yearId}/rows/{rowId}:
    put:
      summary: Edit a row (FR-001, FR-004). Same confirm rule as adding.
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: rowId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Confirm' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeRowInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/FeeRow' } } } }
        '409': { $ref: '#/components/responses/ReviseOrDuplicate' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: Delete a row (FR-002, FR-004). Same confirm rule as adding. The body carries the row version.
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: rowId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Confirm' }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/ReviseOrDuplicate' }
  /fee-structures/{yearId}/finalise:
    post:
      summary: Finalise the year's structure (FR-002, FR-006). Refused (422) when there are no rows or it is already Finalised.
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } } } } }
      responses:
        '200': { description: Finalised, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStructure' } } } }
        '409': { description: Stale version (STALE_VERSION), content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /students/{id}/fees:
    get:
      summary: The Fees block of the profile (FR-009). For the year of the record the profile shows, or ?yearId.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: yearId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Fee, registration fee, brought forward, total due, due date, content: { application/json: { schema: { $ref: '#/components/schemas/StudentFees' } } } }
        '404': { description: No such student }
  /students/{id}/brought-forward:
    put:
      summary: Enter, change or clear the brought-forward amount (FR-007). A null version creates it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BroughtForwardInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/BroughtForward' } } } }
        '409': { description: Stale version (STALE_VERSION), content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /students/{id}/enrollments/{yearId}:
    put:
      summary: CHANGED from F1 (FR-008). Refused with 409 FEE_STRUCTURE_FINALISED when the year's structure is Finalised and the standard or category differs. A division-only change is allowed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: yearId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '409': { description: 'FEE_STRUCTURE_FINALISED, or STALE_VERSION as in F1', content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } } }
  /students/search:
    post:
      summary: CHANGED from F1 (FR-010). Rows gain totalFee (number or null) and the internal column feeState (NOT_SET or null); the Excel export has both. No paid, pending or fee-status columns.
      responses:
        '200': { description: One page }
components:
  parameters:
    Confirm:
      name: confirm
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Must be true to change a row of a Finalised year (the admin saw the warning).
  responses:
    Validation:
      description: 'Field errors: a negative amount, more than two decimals, a missing standard or amount, a second row for the same standard and category, an inactive standard or category, finalising with no rows'
      content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } }
    ReviseOrDuplicate:
      description: |
        REVISE_CONFIRMATION_REQUIRED: the year is Finalised and confirm was not true; nothing is changed and
        `current` is { studentCount } - the number of class records that would be recalculated.
        STALE_VERSION: the row or the structure changed after the screen loaded (latest record in `current`).
      content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } }
  schemas:
    FeeStructure:
      type: object
      properties:
        yearId: { type: integer, format: int64 }
        yearName: { type: string }
        status: { type: string, enum: [Draft, Finalised] }
        version: { type: integer, format: int64, nullable: true, description: 'null while the year has no status row yet' }
        studentCount: { type: integer, description: 'Class records of the year (what a revise recalculates)' }
        rows: { type: array, items: { $ref: '#/components/schemas/FeeRow' } }
    FeeRow:
      type: object
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        standardId: { type: integer, format: int64 }
        standardName: { type: string }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, description: 'All categories when categoryId is null' }
        amount: { type: number, multipleOf: 0.01, minimum: 0 }
        registrationFee: { type: number, multipleOf: 0.01, minimum: 0, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
    FeeRowInput:
      type: object
      required: [standardId, amount]
      properties:
        version: { type: integer, format: int64, description: 'Required when editing' }
        standardId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64, nullable: true }
        amount: { type: number, multipleOf: 0.01, minimum: 0 }
        registrationFee: { type: number, multipleOf: 0.01, minimum: 0, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
    StudentFees:
      type: object
      properties:
        yearId: { type: integer, format: int64, nullable: true }
        yearName: { type: string, nullable: true }
        state: { type: string, enum: [FEE_SET, FEE_NOT_SET, NOT_FINALISED, NO_RECORD] }
        yearFee: { type: number, nullable: true }
        registrationFee: { type: number, nullable: true }
        totalFee: { type: number, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        broughtForward: { $ref: '#/components/schemas/BroughtForward' }
        totalDue: { type: number, description: 'total fee + brought forward; brought forward alone when the state is not FEE_SET' }
    BroughtForward:
      type: object
      properties:
        version: { type: integer, format: int64, nullable: true }
        amount: { type: number, multipleOf: 0.01, minimum: 0 }
        note: { type: string, maxLength: 200, nullable: true }
    BroughtForwardInput:
      type: object
      required: [amount]
      properties:
        version: { type: integer, format: int64, nullable: true }
        amount: { type: number, multipleOf: 0.01, minimum: 0 }
        note: { type: string, maxLength: 200, nullable: true }
