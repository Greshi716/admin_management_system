openapi: 3.0.3
info:
  title: CampusFlow F3 API (fee collection and receipts)
  version: 0.4.0
  description: |
    Endpoints added or changed by F3. Authentication, CSRF, the error shape (Problem), TableRequest, TablePage and the
    stale-save rule are those of F0 (../../001-foundation/contracts/openapi.yaml). F1 endpoints are in
    ../../002-students/contracts/openapi.yaml, F2 endpoints in ../../003-fees/contracts/openapi.yaml.
    Amounts are JSON numbers with at most two decimals and at least zero; anything else is refused with a field error
    (422), never rounded. Dates are ISO dates. There is no endpoint to edit, cancel or delete a receipt (FR-009).
    A refusal that depends on the state of the data is 409 with a `code` (CodedConflictException); a plain input error is
    422 with field errors.
servers:
  - url: /api
security:
  - session: []
paths:
  /students/{studentId}/fee-collection:
    get:
      summary: What the Collect fee screen needs for one student (FR-003, FR-004, FR-005, FR-007, FR-014)
      description: |
        The balance, what is still due per row, the earlier years the admin may pick, the "Paid up to" now, the student's
        receipts, and the `balanceVersion` token the create and mark requests must send back (FR-016).
        A student with no class record in the current year, or no fee, still gets a 200: `currentYear.state` says why a
        current-year receipt is not possible (FEE_NOT_SET, FEE_NOT_FINALISED, NO_CLASS_RECORD) and `canPayCurrentYear` is false.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: The collection context, content: { application/json: { schema: { $ref: '#/components/schemas/FeeCollection' } } } }
        '404': { description: No such student }
  /students/{studentId}/fee-collection/preview:
    post:
      summary: The receipt as it would be saved, without saving (FR-008, FR-011, FR-012)
      description: |
        Same request body and the same rules as POST /receipts for the fee state, the earlier-years order rule, the amounts and what is
        still due, but the receipt number, date, mode and cheque fields are not checked (they cannot change a number and the
        form is not complete while it is typed), the balance token is not checked, nothing is written and no audit entry is made. Returns the total, the total in words and the student's balance
        after (including the "Paid up to" the student would show). The form shows these numbers (the browser adds no money)
        and the confirmation dialog repeats the receipt's own values.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptInput' } } } }
      responses:
        '200': { description: The preview, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptPreview' } } } }
        '409': { $ref: '#/components/responses/ReceiptRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /receipts:
    post:
      summary: Save a receipt (FR-001 to FR-012, FR-021)
      description: |
        One transaction: student lock, balance token check, validation, insert, audit entry (area Fees, action Create).
        Nothing is saved if any step fails.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptInput' } } } }
      responses:
        '201': { description: The saved receipt, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '409': { $ref: '#/components/responses/ReceiptRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /receipts/{serialNo}:
    get:
      summary: One receipt with its status and the school header (FR-010, FR-017). Printing needs no endpoint and records nothing (FR-018).
      parameters:
        - { name: serialNo, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: The receipt, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '404': { description: No such receipt }
  /receipts/{serialNo}/not-cleared:
    post:
      summary: Mark a Cheque receipt "Cheque not cleared" (FR-013, FR-021)
      description: |
        One way. The receipt itself is not changed: a row is added to the marks (data-model receipt_marks). The amount is
        added back to the pending, "Paid up to" is recalculated, one audit entry is written (action Edit, the reason).
      parameters:
        - { name: serialNo, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotClearedInput' } } } }
      responses:
        '200': { description: The receipt with its new status, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '404': { description: No such receipt }
        '409':
          description: |
            BALANCE_CHANGED (the token is out of date; `current` is the fresh FeeCollection), NOT_A_CHEQUE (a Cash receipt),
            ALREADY_MARKED (already marked or voided).
          content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validation' }
  /receipts/search:
    post:
      summary: The receipt register page (FR-019)
      description: |
        TableRequest over the register columns (data-model, research R10). Filters: receiptDate from and to, paymentMode,
        standardId, status (VALID, CHEQUE_NOT_CLEARED, VOIDED); search on receipt no. and student name.
        Money columns are numbers with two decimals. Each row also carries the internal columns studentId (to open the
        profile) and standardId. The standard choices come from GET /student-filter-options (F1,
        ../../002-students/contracts/openapi.yaml); the Collect fee form finds the student with POST /students/search (F1).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/TableRequest' } } } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/TablePage' } } } }
  /receipts/export:
    post:
      summary: Export the register to Excel with the filters in force (FR-020, FR-021)
      description: |
        Main sheet: the same rows and columns as the list (amounts as numeric cells with two decimals, including the hidden
        columns). Second sheet "Day-wise totals": per date the count, cash, cheque and total of valid receipts. Not-cleared and
        voided receipts are on the main sheet with their status and not in the totals. One audit entry (area Fees, action
        Export, the filters and the row count) is written after the file is produced.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/TableRequest' } } } }
      responses:
        '200': { description: The .xlsx file, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
  /receipts/day-totals:
    post:
      summary: Day-wise totals for the filters in force, for the on-screen panel (FR-019, FR-020; first thing to defer)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/TableRequest' } } } }
      responses:
        '200': { description: One entry per date, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayTotal' } } } } }
  /students/{studentId}/fees:
    get:
      summary: CHANGED from F2 (FR-014). The Fees block of the profile now also has paid, pending, "Paid up to" and the receipts.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: yearId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: The Fees block, content: { application/json: { schema: { $ref: '#/components/schemas/StudentFeesBlock' } } } }
        '404': { description: No such student }
  /students/{studentId}/brought-forward:
    put:
      summary: CHANGED from F2 (FR-025). An amount below the total of the valid previous-years receipts is refused.
      description: 422 with a field error on amount whose message shows that total. Takes the student lock, so it waits for a receipt being saved.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Saved }
        '422': { $ref: '#/components/responses/Validation' }
  /students/search:
    post:
      summary: CHANGED from F2 (FR-015). The Students list adds columns; see StudentSearchRow.
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/TablePage' } } } }
components:
  responses:
    Validation:
      description: |
        Field errors (422): a missing or invalid field, more than two decimals, a negative amount, both amounts zero, a
        receipt date in the future (FUTURE_DATE), missing cheque fields, a registration fee on a standard that has none, an
        earlier year that is not before the current one, an empty reason.
      content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } }
    ReceiptRefused:
      description: |
        A refusal that depends on the data (409 with `code`; the field to show it beside, where there is one):
        BALANCE_CHANGED (`current` is the fresh FeeCollection; the screen shows the Refresh pop-up),
        DUPLICATE_RECEIPT_NO (field receiptNo; the number is held by another receipt that is not voided; the message names that receipt's date and serial no.),
        OVERPAYMENT (field registrationPaid or feePaid for a current-year receipt, feePaid for a previous-years receipt, which has no registration row; `current` = { due }),
        FEE_NOT_SET, FEE_NOT_FINALISED, NO_CLASS_RECORD, NO_CURRENT_YEAR (a current-year receipt is not possible),
        BROUGHT_FORWARD_PENDING (a current-year receipt while earlier years' pending remains; `current` = { pending }).
      content: { application/problem+json: { schema: { $ref: '../../001-foundation/contracts/openapi.yaml#/components/schemas/Problem' } } }
  schemas:
    Money:
      type: number
      description: Zero or more, two decimals (for example 10500.00).
    PaidUpTo:
      type: object
      description: The "Fees paid up to" value of a student (profile and Students list only). No receipt carries it.
      properties:
        state: { type: string, enum: [NOTHING, DATE, FULL], description: 'NOTHING = "Nothing paid"; FULL = "Fully paid for the year"' }
        date: { type: string, format: date, nullable: true, description: 'Set for DATE and FULL (the last day of the year)' }
    ReceiptInput:
      type: object
      required: [studentId, receiptType, receiptNo, receiptDate, paymentMode, balanceVersion]
      properties:
        studentId: { type: integer, format: int64 }
        receiptType: { type: string, enum: [CURRENT_YEAR, PREVIOUS_YEARS] }
        receiptNo: { type: string, maxLength: 20 }
        receiptDate: { type: string, format: date, description: 'Today or earlier' }
        registrationPaid: { $ref: '#/components/schemas/Money' }
        feePaid: { $ref: '#/components/schemas/Money' }
        previousYearId: { type: integer, format: int64, description: 'Required for PREVIOUS_YEARS: an academic year before the current one' }
        paymentMode: { type: string, enum: [CASH, CHEQUE] }
        chequeNo: { type: string }
        chequeDate: { type: string, format: date }
        bankName: { type: string }
        balanceVersion: { type: string, description: 'From GET fee-collection; a mismatch is 409 BALANCE_CHANGED' }
    ReceiptPreview:
      type: object
      properties:
        total: { $ref: '#/components/schemas/Money' }
        totalWords: { type: string }
        balanceAfter: { $ref: '#/components/schemas/Balance' }
    NotClearedInput:
      type: object
      required: [reason, balanceVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }
        balanceVersion: { type: string }
    Balance:
      type: object
      description: Computed from the valid receipts (FR-016); never stored.
      properties:
        dueDate: { type: string, format: date, nullable: true, description: 'The due date of the year fee (F2 fee account); shown in the strip of the Collect fee screen' }
        yearFee: { $ref: '#/components/schemas/Money' }
        registrationFee: { $ref: '#/components/schemas/Money' }
        broughtForward: { $ref: '#/components/schemas/Money' }
        totalFee: { $ref: '#/components/schemas/Money' }
        paid: { $ref: '#/components/schemas/Money' }
        pending: { $ref: '#/components/schemas/Money' }
        yearFeeDue: { $ref: '#/components/schemas/Money' }
        registrationDue: { $ref: '#/components/schemas/Money' }
        earlierYearsPending: { $ref: '#/components/schemas/Money' }
        excessPaid: { $ref: '#/components/schemas/Money' }
        paidUpTo: { $ref: '#/components/schemas/PaidUpTo' }
    FeeCollection:
      type: object
      properties:
        student: { type: object, properties: { id: { type: integer, format: int64 }, name: { type: string }, grNo: { type: string }, status: { type: string }, stdDiv: { type: string } } }
        currentYear: { type: object, properties: { id: { type: integer, format: int64 }, name: { type: string }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, state: { type: string, enum: [FEE_SET, FEE_NOT_SET, FEE_NOT_FINALISED, NO_CLASS_RECORD] } } }
        canPayCurrentYear: { type: boolean, description: 'False while the state is not FEE_SET or earlier years pending remains' }
        canPayPreviousYears: { type: boolean, description: 'True when earlier years pending is above zero' }
        chargesRegistrationFee: { type: boolean }
        earlierYears: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, name: { type: string } } }, description: 'Academic years before the current one, newest first' }
        balance: { $ref: '#/components/schemas/Balance' }
        balanceVersion: { type: string }
        receipts: { type: array, items: { $ref: '#/components/schemas/ReceiptSummary' } }
    ReceiptSummary:
      type: object
      properties:
        serialNo: { type: integer, format: int64 }
        receiptNo: { type: string }
        receiptDate: { type: string, format: date }
        receiptType: { type: string, enum: [CURRENT_YEAR, PREVIOUS_YEARS] }
        paymentMode: { type: string, enum: [CASH, CHEQUE] }
        total: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [VALID, CHEQUE_NOT_CLEARED, VOIDED] }
    Receipt:
      allOf:
        - $ref: '#/components/schemas/ReceiptSummary'
        - type: object
          properties:
            studentId: { type: integer, format: int64, description: 'Links the receipt view to the student profile and to GET /students/{id}/fee-collection' }
            balanceVersion: { type: string, description: 'The student''s current balance token, so Mark not cleared can send it back (FR-016); changes after every receipt, mark, revise or brought-forward edit of that student' }
            academicYear: { type: string }
            studentName: { type: string }
            grNo: { type: string }
            standardName: { type: string, nullable: true }
            divisionName: { type: string, nullable: true }
            registrationPaid: { $ref: '#/components/schemas/Money' }
            feePaid: { $ref: '#/components/schemas/Money' }
            totalWords: { type: string }
            chequeNo: { type: string, nullable: true }
            chequeDate: { type: string, format: date, nullable: true }
            bankName: { type: string, nullable: true }
            statusReason: { type: string, nullable: true }
            markedAt: { type: string, format: date-time, nullable: true }
            school: { type: object, properties: { name: { type: string }, address: { type: string, nullable: true }, phone: { type: string, nullable: true } }, description: 'From campusflow.school.* (the print header; the name is required, address and phone are empty for now)' }
    DayTotal:
      type: object
      properties:
        date: { type: string, format: date }
        count: { type: integer }
        cash: { $ref: '#/components/schemas/Money' }
        cheque: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    StudentFeesBlock:
      description: CHANGED from F2 (FR-014). F2's fields (../../003-fees/contracts/openapi.yaml) plus these.
      type: object
      properties:
        balance: { $ref: '#/components/schemas/Balance' }
        receipts: { type: array, items: { $ref: '#/components/schemas/ReceiptSummary' } }
    StudentSearchRow:
      description: CHANGED from F2 (FR-015). F2's columns plus these. All sortable, filterable and in the Excel export as numeric cells with two decimals; the screen shows the state texts instead of an amount when there is none.
      type: object
      properties:
        paid: { type: number, nullable: true, description: 'Valid current-year receipts of the shown record' }
        pending: { type: number, nullable: true, description: 'Pending of the shown record (year fee and registration fee)' }
        earlierPending: { type: number, nullable: true, description: 'Brought-forward amount minus valid previous-years receipts' }
        paidUpTo: { type: string, format: date, nullable: true, description: 'The last paid day (year start + days paid - 1)' }
        paidUpToState: { type: string, enum: [NOTHING, DATE, FULL], nullable: true }
        feeStatus: { type: string, enum: [Paid, Partly paid, Unpaid], nullable: true, description: 'Null when there is no fee amount (feeState says why)' }
