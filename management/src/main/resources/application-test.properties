spring.datasource.url=jdbc:postgresql://localhost:5432/admin_management_test
spring.flyway.clean-disabled=false

# Playwright starts the backend with this profile and needs an empty database every run.
campusflow.test.reset-database-on-start=true

# Known sign-in for UI tests (test-only values, not a real credential). The first-run bootstrap (T043) creates
# the admin with this password, already marked as changed, when these are set. Keep in step with
# frontend/e2e/support/test-data.ts and the backend TestAdmin helper.
campusflow.test-admin.username=testadmin
campusflow.test-admin.password=Test-Admin-Password-1

# Synthetic school header for tests (F3, FR-017).
campusflow.school.name=Test School
