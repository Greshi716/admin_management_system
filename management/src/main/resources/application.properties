spring.application.name= management


spring.datasource.url=jdbc:postgresql://localhost:5432/admin_management_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

campusflow.data-dir=./data

# Student photo upload limit (F1, FR-005); the request limit leaves room for the form fields.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Error bodies never carry exception messages, stack traces or binding details (T102).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# The school header printed on every receipt (F3, FR-017). The name is required; address and phone are optional.
# Override with the environment variables CAMPUSFLOW_SCHOOL_NAME, CAMPUSFLOW_SCHOOL_ADDRESS, CAMPUSFLOW_SCHOOL_PHONE.
campusflow.school.name=Birlasagar Higher Secondary School
campusflow.school.address=
campusflow.school.phone=

# Demo signup (F6): off unless CAMPUSFLOW_SIGNUP_ENABLED=true. Never turn it on with real school data.
campusflow.signup-enabled=${CAMPUSFLOW_SIGNUP_ENABLED:false}
