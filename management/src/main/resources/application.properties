spring.application.name= management


spring.datasource.url=jdbc:postgresql://localhost:5432/admin_management_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

campusflow.data-dir=./data

# Error bodies never carry exception messages, stack traces or binding details (T102).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
